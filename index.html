<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roots &amp; Froots | Citroots Tisane</title>
<meta name="description" content="Roots & Froots, a local wellness food and beverage brand from Iloilo City. Meet Citroots Tisane, made with ginger, calamansi and lemongrass.">
<meta property="og:title" content="Roots &amp; Froots | Citroots Tisane">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@400;600;700&display=swap">
<style>
:root{--dg:#0f5a2c;--lg:#7ed321;--yl:#ffd93b;--or:#f28c1e;--bg:#fff;--soft:#f6fbe9;--tx:#173b24;--card:#fff;--line:#d8ecb8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d2616;--soft:#12331d;--tx:#eaf6dc;--card:#173d25;--line:#2a5a38}}
html{scroll-behavior:smooth;scroll-padding-top:70px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 1.05rem/1.6 Nunito,system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.1;margin:0 0 .5em}
h2{font-size:clamp(1.9rem,6vw,2.8rem);font-weight:800;text-align:center}
img{max-width:100%;display:block}
a{color:inherit}
section{padding:80px clamp(26px,7vw,72px);position:relative}
.wrap{max-width:1040px;margin:auto}
nav{position:sticky;top:0;z-index:20;background:var(--dg);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px clamp(20px,5vw,48px);padding-top:calc(10px + env(safe-area-inset-top,0px))}
nav img{width:46px;height:46px;border-radius:50%;flex-shrink:0;margin-right:24px}
nav div{display:flex;gap:14px;overflow-x:auto;font-weight:700;font-size:.95rem}
nav a{text-decoration:none;white-space:nowrap}
nav a:hover{color:var(--yl)}
.btn{display:inline-block;background:var(--yl);color:var(--dg);font-weight:800;padding:14px 26px;border-radius:999px;text-decoration:none;border:3px solid var(--dg);box-shadow:0 5px 0 var(--dg);transition:transform .15s}
.btn:hover{transform:translateY(3px);box-shadow:0 2px 0 var(--dg)}
.hero{background:var(--dg);color:#fff;padding:64px clamp(26px,7vw,72px) 110px}
.hero .wrap{display:grid;gap:28px;align-items:center}
@media(min-width:800px){.hero .wrap{grid-template-columns:1.1fr 1fr}}
.hero h1{font-size:clamp(2.4rem,8vw,4.2rem);font-weight:800}
.hero h1 span{color:var(--yl)}
.hero img.ph{border-radius:36px;border:6px solid var(--lg);transform:rotate(2deg);animation:sway 5s ease-in-out infinite alternate}
@keyframes sway{to{transform:rotate(-2deg)}}
@media(prefers-reduced-motion:reduce){.hero img.ph{animation:none}}
.wave{position:absolute;left:0;right:0;bottom:-1px;height:50px;width:100%}
.soft{background:var(--soft)}
.two{display:grid;gap:28px}
@media(min-width:700px){.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}}
.three{display:grid;gap:32px}
.card{background:var(--card);border:3px solid var(--line);border-radius:28px;padding:28px}
.mis{background:var(--dg);color:#fff;border-color:var(--dg);border-radius:40px 12px 40px 12px}
.vis{background:var(--yl);color:#3b2d00;border-color:var(--yl);border-radius:12px 40px 12px 40px}
.vals{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:28px}
.vals .card:nth-child(3n+1){border-radius:30px 8px 30px 8px}
.vals .card:nth-child(3n+2){border-radius:8px 30px 8px 30px}
.vals b{font-family:Fraunces,serif;font-size:1.25rem;color:var(--or);display:block}
.sizes .card{text-align:center}
.price{font-family:Fraunces,serif;font-size:2.2rem;font-weight:800;color:var(--or)}
.banner{background:var(--lg);color:var(--dg);font-weight:800;border-radius:999px;padding:16px 28px;text-align:center;margin:28px 0;font-size:1.1rem}
.note{background:var(--card);border:3px dashed var(--or);border-radius:24px;padding:20px}
.ing .ip{width:100%;height:190px;object-fit:contain;background:#fff;border-radius:20px;margin-bottom:14px}.ing .card{position:relative}.stk{position:absolute;pointer-events:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}.row{display:flex;justify-content:center;gap:10px;margin-bottom:36px}.row img{width:92px;animation:hop 2.4s ease-in-out infinite;filter:drop-shadow(0 4px 4px rgba(0,0,0,.2))}.row img+img{animation-delay:.6s}@keyframes hop{50%{transform:translateY(-10px) rotate(4deg)}}@media(prefers-reduced-motion:reduce){.row img{animation:none}}.hero{overflow:hidden;position:relative}.hero .stk{z-index:2}
.ing h3{color:var(--or);font-size:1.6rem}
.gal{columns:2;gap:12px;margin-top:28px}
@media(min-width:800px){.gal{columns:3}}
.gal img{width:100%;border-radius:20px;margin-bottom:12px;cursor:zoom-in;border:3px solid var(--line);transition:transform .2s}
.gal img:hover{transform:rotate(-1.5deg) scale(1.02)}
.pin{width:28px;height:28px;flex-shrink:0;color:var(--or)}.map{text-decoration:none;display:block}.map:hover b,.map:focus-visible b{color:var(--or);text-decoration:underline}.map small{color:var(--or);font-weight:700}.vals .card{border-top:8px solid var(--lg)}.vals .card:nth-child(3n+2){border-top-color:var(--yl)}.vals .card:nth-child(3n){border-top-color:var(--or)}
.loc{display:flex;gap:12px;align-items:flex-start}
.contact a.l{display:block;font-weight:700;margin:6px 0}
footer{background:var(--dg);color:#fff;text-align:center;padding:48px 28px calc(48px + env(safe-area-inset-bottom,0px))}
footer img{width:80px;height:80px;border-radius:50%;margin:0 auto 12px}
footer a{margin:0 10px;font-weight:700}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#lb.on{display:flex}#lb img{max-height:92vh;border-radius:16px}
a:focus-visible,button:focus-visible,.gal img:focus-visible{outline:3px solid var(--or);outline-offset:3px}
.steps{display:grid;gap:16px;counter-reset:s;margin:28px 0}.steps .card{position:relative;padding-left:72px}.steps .card::before{counter-increment:s;content:counter(s);position:absolute;left:20px;top:22px;width:38px;height:38px;border-radius:50%;background:var(--yl);color:var(--dg);font:800 1.2rem Fraunces,serif;display:flex;align-items:center;justify-content:center;border:3px solid var(--dg)}.steps b{font-family:Fraunces,serif;font-size:1.2rem;color:var(--or);display:block}
.faq{max-width:760px;margin:28px auto 0;display:grid;gap:12px}.faq details{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:4px 20px}.faq summary{cursor:pointer;font-weight:800;padding:14px 0;list-style:none;display:flex;justify-content:space-between;gap:12px;align-items:center}.faq summary::-webkit-details-marker{display:none}.faq summary::after{content:"+";color:var(--or);font-size:1.6rem;line-height:1;flex-shrink:0}.faq details[open] summary::after{content:"\2212"}.faq details[open]{border-color:var(--lg)}.faq details>div{padding:0 0 16px}.faq ul{margin:8px 0 12px;padding-left:22px}.faq li{margin:4px 0}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:column;gap:8px;align-items:flex-end}.fab .btn{padding:10px 18px;font-size:.95rem;box-shadow:0 4px 0 var(--dg)}.follow .btn{margin:6px 4px}.band{overflow:hidden;white-space:nowrap;background:var(--yl);color:var(--dg);border-block:4px solid var(--lg);padding:10px 0;margin:28px calc(-1*clamp(26px,7vw,72px)) -40px;position:relative;z-index:1}.track{display:inline-flex;animation:mq 22s linear infinite}.track span{font:800 1.3rem Fraunces,Georgia,serif;padding-right:2.5rem}.track span::after{content:"\2022";padding-left:2.5rem;color:var(--or)}@keyframes mq{to{transform:translateX(-50%)}}@media(prefers-reduced-motion:reduce){.track{animation:none}}
</style></head><body>
